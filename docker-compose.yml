# SkyBook AI — Docker Compose (security training lab ONLY — not production-secure)
# Usage (from repo root):
#   cp docker/.env.example .env
#   docker compose up --build
name: skybook-ai

services:
  mysql:
    image: mysql:8.4
    container_name: skybook-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-skybook}
      MYSQL_USER: ${DB_USER:-skybook}
      MYSQL_PASSWORD: ${DB_PASSWORD:-skybook}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - skybook-mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s
    networks:
      - skybook-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skybook-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-skybook}
      DB_USER: ${DB_USER:-skybook}
      DB_PASSWORD: ${DB_PASSWORD:-skybook}
      JWT_SECRET: ${JWT_SECRET:-SkyBookLabOnlySecretKeyChangeMe_MustBeAtLeast256BitsLong!!}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-30}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AI_SERVICE_URL: http://python-ai:8000
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-training}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v3/api-docs >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks:
      - skybook-net

  python-ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: skybook-python-ai
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-skybook}
      DB_USER: ${DB_USER:-skybook}
      DB_PASSWORD: ${DB_PASSWORD:-skybook}
      BACKEND_URL: http://backend:8080/api/v1
      JWT_SECRET: ${JWT_SECRET:-SkyBookLabOnlySecretKeyChangeMe_MustBeAtLeast256BitsLong!!}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      TRAINING_MODE: ${TRAINING_MODE:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    ports:
      - "${AI_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - skybook-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_AI_URL: /ai/api/v1
    container_name: skybook-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      python-ai:
        condition: service_started
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    networks:
      - skybook-net

networks:
  skybook-net:
    driver: bridge

volumes:
  skybook-mysql-data:
