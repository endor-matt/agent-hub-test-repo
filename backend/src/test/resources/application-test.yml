spring:
  datasource:
    url: jdbc:h2:mem:skybook;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

skybook:
  jwt:
    secret: TestOnlySecretKeyForUnitTests_MustBeAtLeast256BitsLong!!
    access-token-minutes: 30
    refresh-token-days: 7
  cors:
    allowed-origins: http://localhost:3000
  training:
    enabled: true

spring:
  profiles:
    active: training
